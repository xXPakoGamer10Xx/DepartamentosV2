name: Deploy NethRent

# Solo push a main y ejecución manual. NUNCA pull_request: el runner es propio y el repo es público.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un solo despliegue a la vez.
concurrency:
  group: deploy-nethrent
  cancel-in-progress: false

jobs:
  # Compuerta de calidad en runners de GitHub: si falla, no se despliega nada.
  ci:
    name: Pruebas
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Despliegue en el servidor
    needs: ci
    # Runner propio instalado en el servidor (etiqueta "nethrent").
    runs-on: [self-hosted, nethrent]
    timeout-minutes: 30
    env:
      PROJECT_DIR: /home/server/Departamentos
    steps:
      - name: Obtener los últimos cambios de main
        run: |
          cd "$PROJECT_DIR"
          git fetch origin main
          git merge --ff-only origin/main

      # Respaldo antes de tocar nada: si la nueva versión migra mal, hay a dónde volver. Conserva los 5 últimos.
      # Contiene todos los datos: va a una carpeta privada (0700) fuera de la que ve el contenedor, con archivos 0600.
      - name: Respaldo previo al despliegue
        run: |
          set -o pipefail
          umask 077
          cd "$PROJECT_DIR"
          dir="$(dirname "$PROJECT_DIR")/depas-respaldos-previos"
          mkdir -p -m 700 "$dir"; chmod 700 "$dir"
          if docker compose ps --status running --services | grep -qx db; then
            f="$dir/pre-deploy_$(date +%Y%m%d-%H%M%S)_${GITHUB_SHA::7}.sql.gz"
            docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$f"
            test -s "$f" && echo "Respaldo guardado: $f"
            ls -1t "$dir"/pre-deploy_*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          else
            echo "La base de datos aún no está corriendo: no hay nada que respaldar."
          fi

      - name: Construir imagen del backend (con la web incluida)
        run: |
          cd "$PROJECT_DIR"
          nice -n 19 docker compose build backend

      # Solo db y backend. El servicio "migrate" (perfil tools) hace DROP de las tablas y NO se ejecuta nunca desde aquí.
      - name: Levantar base de datos y backend
        run: |
          cd "$PROJECT_DIR"
          docker compose up -d db backend

      - name: Comprobar que la aplicación responde
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3001/health || true)
            if [ "$code" = "200" ]; then echo "Backend respondiendo (HTTP $code)."; exit 0; fi
            echo "Intento $i: HTTP $code, reintentando..."; sleep 5
          done
          echo "::error::El backend no respondió tras el despliegue."
          cd "$PROJECT_DIR"
          docker compose ps
          docker compose logs --tail 40 backend
          exit 1

      - name: Limpiar imágenes en desuso
        if: success()
        run: docker image prune -f
